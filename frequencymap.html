<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive NUTS3 Map for Germany</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>

            height: 700px;
            width: 100%;
            background-color: #5e5e5e; /* Light background to contrast with regions */

</head>
<body>
    <h1>Amount of Entries by NUTS3 Region</h1>
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/polylabel@2.0.1/polylabel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="frequencymap.js"></script> <!-- Link to the external JavaScript file -->

</html>
